<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700"><rect width="1000" height="700" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#526875"/></marker></defs><text x="25" y="38" font-family="Arial" font-size="26" fill="#22323d"><tspan x="25" dy="0">F4 Recover from a failed or unsuitable AI plan</tspan></text><text x="25" y="77" font-family="Arial" font-size="20" fill="#22323d"><tspan x="25" dy="0">P3 Rosa and P1 Maya</tspan></text><rect x="25" y="110" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="133" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">1. Observe service error or rejected strategy</tspan></text><path d="M285 171 L285 193" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="193" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="216" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">2. Read a specific explanation with progress kept</tspan></text><path d="M285 254 L285 276" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="276" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="299" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">3. Review selected shore, difficulty and</tspan><tspan x="40" dy="23.400000000000002">connection</tspan></text><path d="M285 337 L285 359" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="359" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="382" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">4. Choose retry, changed input, Solo or local AI</tspan></text><path d="M285 420 L285 442" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="442" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="465" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">5. Review a fresh valid plan or local label</tspan></text><path d="M285 503 L285 525" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="525" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="548" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">6. Start only after an explicit user choice</tspan></text><path d="M545 140 L590 140" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="130" font-family="Arial" font-size="20" fill="#22323d"><tspan x="605" dy="0">Poor / empty / unsupported output</tspan></text><text x="605" y="160" font-family="Arial" font-size="17" fill="#22323d"><tspan x="605" dy="0">Invalid JSON, extra fields, illegal</tspan><tspan x="605" dy="22.1">plan or wrong focus is rejected. No</tspan><tspan x="605" dy="22.1">match starts. For a legal but</tspan><tspan x="605" dy="22.1">unwanted tactic, regenerate or</tspan><tspan x="605" dy="22.1">reject.</tspan></text><path d="M545 389 L590 389" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="379" font-family="Arial" font-size="20" fill="#22323d"><tspan x="605" dy="0">Offline / timeout / rate limit</tspan></text><text x="605" y="409" font-family="Arial" font-size="17" fill="#22323d"><tspan x="605" dy="0">Retry when ready, cancel a long wait,</tspan><tspan x="605" dy="22.1">or choose Solo/local AI. Provider 429</tspan><tspan x="605" dy="22.1">maps to a busy-service message.</tspan></text></svg>