<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700"><rect width="1000" height="700" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#526875"/></marker></defs><text x="25" y="38" font-family="Arial" font-size="26" fill="#22323d"><tspan x="25" dy="0">F5 Continue, request assistance and finish</tspan></text><text x="25" y="77" font-family="Arial" font-size="20" fill="#22323d"><tspan x="25" dy="0">P2 Daniel, P1 Maya and P3 Rosa</tspan></text><rect x="25" y="110" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="133" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">1. Read round result and visible score</tspan></text><path d="M285 171 L285 193" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="193" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="216" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">2. Choose next shore after a clear or retry a</tspan><tspan x="40" dy="23.400000000000002">loss</tspan></text><path d="M285 254 L285 276" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="276" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="299" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">3. Optional: confirm an assisted passage</tspan></text><path d="M285 337 L285 359" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="359" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="382" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">4. Map records Cleared or Assisted honestly</tspan></text><path d="M285 420 L285 442" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="442" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="465" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">5. Pass all five shores and reach Homecoming</tspan></text><path d="M285 503 L285 525" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="525" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="548" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">6. Replay a trial or confirm a new voyage</tspan></text><path d="M545 306 L590 306" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="296" font-family="Arial" font-size="20" fill="#22323d"><tspan x="605" dy="0">Reconsider help</tspan></text><text x="605" y="326" font-family="Arial" font-size="17" fill="#22323d"><tspan x="605" dy="0">Keep trying closes S15 without</tspan><tspan x="605" dy="22.1">changing progress. A later successful</tspan><tspan x="605" dy="22.1">replay upgrades Assisted to Cleared.</tspan></text><path d="M545 555 L590 555" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="545" font-family="Arial" font-size="20" fill="#22323d"><tspan x="605" dy="0">New voyage</tspan></text><text x="605" y="575" font-family="Arial" font-size="17" fill="#22323d"><tspan x="605" dy="0">S14 explains that restarting replaces</tspan><tspan x="605" dy="22.1">progress. Keep voyage returns</tspan><tspan x="605" dy="22.1">unchanged.</tspan></text></svg>