<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 800"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526875"/></marker></defs><rect x="30" y="30" width="560" height="510" fill="#ffffff" stroke="#555555"/><text x="46" y="64.0" font-family="Arial" font-size="20" font-weight="bold" fill="#222222">W14 Sirens counter melody</text><text x="46" y="96.0" font-family="Arial" font-size="16" font-weight="normal" fill="#526875">S07 / Reply / F3</text><rect x="46" y="119.8" width="528" height="52" fill="#fafafa" stroke="#aaaaaa"/><text x="58" y="147.8" font-family="Arial" font-size="18" font-weight="normal" fill="#252525">Reply / entered notes / remaining time</text><rect x="46" y="179.8" width="528" height="140" fill="#eeeeee" stroke="#aaaaaa"/><rect x="58.0" y="201.8" width="114.0" height="95" fill="#ffffff" stroke="#777777"/><text x="67.0" y="239.8" font-family="Arial" font-size="18" font-weight="bold" fill="#222222">A / 1</text><rect x="180.0" y="201.8" width="114.0" height="95" fill="#ffffff" stroke="#777777"/><text x="189.0" y="239.8" font-family="Arial" font-size="18" font-weight="bold" fill="#222222">S / 2</text><rect x="302.0" y="201.8" width="114.0" height="95" fill="#ffffff" stroke="#777777"/><text x="311.0" y="239.8" font-family="Arial" font-size="18" font-weight="bold" fill="#222222">D / 3</text><rect x="424.0" y="201.8" width="114.0" height="95" fill="#ffffff" stroke="#777777"/><text x="433.0" y="239.8" font-family="Arial" font-size="18" font-weight="bold" fill="#222222">F / 4</text><rect x="46" y="327.8" width="528" height="52" fill="#fafafa" stroke="#aaaaaa"/><text x="58" y="355.8" font-family="Arial" font-size="18" font-weight="normal" fill="#252525">Temptation increases on wrong or missing notes</text><rect x="46" y="387.8" width="528" height="52" fill="#eeeeee" stroke="#aaaaaa"/><text x="58" y="415.8" font-family="Arial" font-size="18" font-weight="normal" fill="#252525">Press pads or use keys / Pause</text><text x="30" y="575.0" font-family="Arial" font-size="19" font-weight="bold" fill="#126978">Implemented</text><text x="30" y="612.7" font-family="Arial" font-size="20" font-weight="normal" fill="#526875">The Sirens target missed lanes in later melodies. Pads use</text><text x="30" y="638.7" font-family="Arial" font-size="20" font-weight="normal" fill="#526875">labels as well as color.</text></svg>