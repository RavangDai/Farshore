<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526875"/></marker></defs><rect x="64.0" y="70.0" width="322.17391304347825" height="100.37234042553192" fill="#f7fafb" stroke="#79909b"/><text x="75.89565217391305" y="108.34061054579094" font-family="Arial" font-size="21.808695652173913" font-weight="bold" fill="#102e40">Selected shore, difficulty,</text><text x="75.89565217391305" y="136.69191489361702" font-family="Arial" font-size="21.808695652173913" font-weight="bold" fill="#102e40">up to 2 numeric summaries</text><rect x="490.26086956521743" y="70.0" width="267.6521739130435" height="100.37234042553192" fill="#f7fafb" stroke="#79909b"/><text x="502.1565217391305" y="108.34061054579094" font-family="Arial" font-size="21.808695652173913" font-weight="bold" fill="#102e40">React preparation</text><text x="502.1565217391305" y="136.69191489361702" font-family="Arial" font-size="21.808695652173913" font-weight="bold" fill="#102e40">Request + Cancel</text><rect x="862.0" y="70.0" width="337.04347826086956" height="100.37234042553192" fill="#f7fafb" stroke="#79909b"/><text x="873.895652173913" y="108.34061054579094" font-family="Arial" font-size="21.808695652173913" font-weight="bold" fill="#102e40">POST /api/arcade</text><text x="873.895652173913" y="136.69191489361702" font-family="Arial" font-size="21.808695652173913" font-weight="bold" fill="#102e40">Derive observations</text><rect x="862.0" y="294.36170212765956" width="337.04347826086956" height="100.37234042553192" fill="#f7fafb" stroke="#79909b"/><text x="873.895652173913" y="332.70231267345054" font-family="Arial" font-size="21.808695652173913" font-weight="bold" fill="#102e40">Local Ollama</text><text x="873.895652173913" y="361.05361702127664" font-family="Arial" font-size="21.808695652173913" font-weight="bold" fill="#102e40">Llama 3.2 3B</text><rect x="490.26086956521743" y="294.36170212765956" width="297.3913043478261" height="100.37234042553192" fill="#f7fafb" stroke="#79909b"/><text x="502.1565217391305" y="332.70231267345054" font-family="Arial" font-size="21.808695652173913" font-weight="bold" fill="#102e40">Validate planId + focus</text><text x="502.1565217391305" y="361.05361702127664" font-family="Arial" font-size="21.808695652173913" font-weight="bold" fill="#102e40">Authored description</text><rect x="64.0" y="294.36170212765956" width="322.17391304347825" height="100.37234042553192" fill="#f7fafb" stroke="#79909b"/><text x="75.89565217391305" y="332.70231267345054" font-family="Arial" font-size="21.808695652173913" font-weight="bold" fill="#102e40">Review, then start</text><text x="75.89565217391305" y="361.05361702127664" font-family="Arial" font-size="21.808695652173913" font-weight="bold" fill="#102e40">Local rival simulation</text><line x1="386.17391304347825" y1="119.59574468085107" x2="490.26086956521743" y2="119.59574468085107" stroke="#526875" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="757.9130434782609" y1="119.59574468085107" x2="862.0" y2="119.59574468085107" stroke="#526875" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1030.521739130435" y1="170.37234042553192" x2="1030.521739130435" y2="294.36170212765956" stroke="#526875" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="862.0" y1="343.95744680851067" x2="787.6521739130435" y2="343.95744680851067" stroke="#526875" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="490.26086956521743" y1="343.95744680851067" x2="386.17391304347825" y2="343.95744680851067" stroke="#526875" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="64" y="477.3936170212766" width="565.0434782608696" height="94.46808510638299" fill="#f7fafb" stroke="#79909b"/><text x="75.89565217391305" y="515.7342275670676" font-family="Arial" font-size="21.808695652173913" font-weight="normal" fill="#102e40">Browser localS