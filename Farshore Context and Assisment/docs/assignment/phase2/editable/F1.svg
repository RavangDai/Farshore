<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536874"/></marker></defs><text x="20" y="30" fill="#102e40" font-size="24" font-family="Arial">F1: Start or resume a voyage</text><text x="20" y="58" fill="#46626e" font-size="17" font-family="Arial">P2 Daniel</text><rect x="22" y="90" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="115" fill="#102e40" font-size="17" font-family="Arial">1. Open title screen</text><path d="M240 143 L240 166" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="166" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="191" fill="#102e40" font-size="17" font-family="Arial">2. Choose Begin or Resume</text><path d="M240 219 L240 242" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="242" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="267" fill="#102e40" font-size="17" font-family="Arial">3. New: read/skip introduction</text><path d="M240 295 L240 318" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="318" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="343" fill="#102e40" font-size="17" font-family="Arial">4. Read encounter and mode label</text><path d="M240 371 L240 394" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="394" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="419" fill="#102e40" font-size="17" font-family="Arial">5. Type counsel or choose dictation</text><path d="M240 447 L240 470" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="470" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="495" fill="#102e40" font-size="17" font-family="Arial">6. Submit a first turn</text><path d="M457 192 L497 192" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="166" width="460" height="106" fill="#fff6e7" stroke="#a9884b"/><text x="517" y="191" fill="#6e5423" font-size="17" font-family="Arial">New voyage with a save</text><text x="517" y="215" fill="#4b4b4b" font-size="15" font-family="Arial">S12 warns before replacing progress. Keep voyage</text><text x="517" y="234.5" fill="#4b4b4b" font-size="15" font-family="Arial">returns to S01.</text><path d="M457 344 L497 344" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="318" width="460" height="106" fill="#fff6e7" stroke="#a9884b"/><text x="517" y="343" fill="#6e5423" font-size="17" font-family="Arial">AI unavailable</text><text x="517" y="367" fill="#4b4b4b" font-size="15" font-family="Arial">S11 explains connection status. Start in labeled Story</text><text x="517" y="386.5" fill="#4b4b4b" font-size="15" font-family="Arial">mode or check connection again.</text></svg>