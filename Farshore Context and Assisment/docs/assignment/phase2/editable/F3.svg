<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536874"/></marker></defs><text x="20" y="30" fill="#102e40" font-size="24" font-family="Arial">F3: Dictate and correct counsel</text><text x="20" y="58" fill="#46626e" font-size="17" font-family="Arial">P2 Daniel</text><rect x="22" y="90" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="115" fill="#102e40" font-size="17" font-family="Arial">1. Choose Dictate or Voice typing</text><path d="M240 143 L240 166" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="166" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="191" fill="#102e40" font-size="17" font-family="Arial">2. Allow microphone / Windows + H</text><path d="M240 219 L240 242" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="242" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="267" fill="#102e40" font-size="17" font-family="Arial">3. Wait for Listening</text><path d="M240 295 L240 318" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="318" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="343" fill="#102e40" font-size="17" font-family="Arial">4. Speak, then Stop</text><path d="M240 371 L240 394" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="394" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="419" fill="#102e40" font-size="17" font-family="Arial">5. Review and edit transcript</text><path d="M240 447 L240 470" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="470" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="495" fill="#102e40" font-size="17" font-family="Arial">6. Send reviewed text through F2</text><path d="M457 192 L497 192" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="166" width="460" height="106" fill="#fff6e7" stroke="#a9884b"/><text x="517" y="191" fill="#6e5423" font-size="17" font-family="Arial">Permission/service failure</text><text x="517" y="215" fill="#4b4b4b" font-size="15" font-family="Arial">Show a specific message. Preserve existing text. Retry</text><text x="517" y="234.5" fill="#4b4b4b" font-size="15" font-family="Arial">dictation or Type instead.</text><path d="M457 420 L497 420" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="394" width="460" height="106" fill="#fff6e7" stroke="#a9884b"/><text x="517" y="419" fill="#6e5423" font-size="17" font-family="Arial">Missing or suspicious words</text><text x="517" y="443" fill="#4b4b4b" font-size="15" font-family="Arial">Keep the draft. Highlight review instruction. Edit,</text><text x="517" y="462.5" fill="#4b4b4b" font-size="15" font-family="Arial">re-record or type.</text></svg>