<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536874"/></marker></defs><rect x="1" y="1" width="598" height="578" fill="#fff" stroke="#51575c"/><text x="20" y="30" fill="#111" font-size="19" font-family="Arial">W18 Speech input / A2</text><text x="20" y="57" fill="#555" font-size="13" font-family="Arial">A2-LOADING / F3</text><rect x="20" y="80" width="560" height="46" fill="#fafafa" stroke="#8b9398"/><text x="34" y="102" fill="#222" font-size="15" font-family="Arial">Starting dictation / Listening</text><rect x="20" y="135" width="560" height="46" fill="#fafafa" stroke="#8b9398"/><text x="34" y="157" fill="#222" font-size="15" font-family="Arial">Allow microphone, then speak</text><rect x="20" y="190" width="560" height="64" fill="#fafafa" stroke="#8b9398"/><text x="34" y="212" fill="#222" font-size="15" font-family="Arial">Keep existing counsel visible</text><rect x="20" y="263" width="560" height="46" fill="#e5e5e5" stroke="#8b9398"/><text x="34" y="285" fill="#222" font-size="15" font-family="Arial">Cancel start / Stop listening</text><rect x="20" y="318" width="560" height="46" fill="#fafafa" stroke="#8b9398"/><text x="34" y="340" fill="#222" font-size="15" font-family="Arial">Send unavailable until dictation ends</text></svg>