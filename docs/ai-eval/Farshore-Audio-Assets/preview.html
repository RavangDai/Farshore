n": 2.7, "loop": false}, "boulder-rumble": {"src": "sfx/boulder-rumble.wav", "duration": 1.8, "loop": false}, "wind-gust": {"src": "sfx/wind-gust.wav", "duration": 1.8, "loop": false}, "sail-flap": {"src": "sfx/sail-flap.wav", "duration": 0.95, "loop": false}, "potion-mix": {"src": "sfx/potion-mix.wav", "duration": 1.35, "loop": false}, "magic-pulse": {"src": "sfx/magic-pulse.wav", "duration": 1.35, "loop": false}, "siren-note": {"src": "sfx/siren-note.wav", "duration": 2.25, "loop": false}, "maelstrom-surge": {"src": "sfx/maelstrom-surge.wav", "duration": 2.6, "loop": false}, "sea-monster-roar": {"src": "sfx/sea-monster-roar.wav", "duration": 2.6, "loop": false}, "raft-creak": {"src": "sfx/raft-creak.wav", "duration": 0.95, "loop": false}, "water-splash": {"src": "sfx/water-splash.wav", "duration": 0.8, "loop": false}, "bow-twang": {"src": "sfx/bow-twang.wav", "duration": 0.45, "loop": false}, "target-hit": {"src": "sfx/target-hit.wav", "duration": 0.65, "loop": false}}, "voices": {"intro": {"src": "voice/intro.mp3", "role": "Narrator", "subtitle": "The war is over. But the gods are not finished with you. Eight trials stand between you and Ithaca. The sea remembers. The gods are watching. Your journey home begins now.", "loop": false}, "lotus-eaters": {"src": "voice/lotus-eaters.mp3", "role": "Narrator", "subtitle": "Beware the sweetness of forgetting. The lotus has stolen your sailors' memories. Bring your crew home before the island claims them.", "loop": false}, "cyclops-cave": {"src": "voice/cyclops-cave.mp3", "role": "Narrator", "subtitle": "Within the darkness, a single eye awaits. The cave is not your home. Run, and find the light beyond the mountain.", "loop": false}, "aeolus": {"src": "voice/aeolus.mp3", "role": "Narrator", "subtitle": "The lord of winds has granted you a chance. Read the changing currents, master the storm, and guide your ship onward.", "loop": false}, "circes-palace": {"src": "voice/circes-palace.mp3", "role": "Narrator", "subtitle": "Not every enchantment can be broken by strength. In Circe's palace, wisdom may be your only way through.", "loop": false}, "sirens-passage": {"src": "voice/sirens-passage.mp3", "role": "Narrator", "subtitle": "Listen carefully, but do not surrender. The most beautiful song upon these waters may be your last.", "loop": false}, "scylla-charybdis": {"src": "voice/scylla-charybdis.mp3", "role": "Narrator", "subtitle": "Between two terrors lies a narrow passage. Steady your vessel. Every choice you make will carry you closer to the far shore.", "loop": false}, "calypsos-raft": {"src": "voice/calypsos-raft.mp3", "role": "Narrator", "subtitle": "Calypso's island can offer peace, but your journey is not yet ended. Freedom lies beyond the breaking waves.", "loop": false}, "ithaca": {"src": "voice/ithaca.mp3", "role": "Narrator", "subtitle": "After all these years, the shores of Ithaca rise before you. One final trial remains. Claim the home you have longed for.", "loop": false}, "oracle-ready": {"src": "voice/oracle-ready.mp3", "role": "Oracle", "subtitle": "The Oracle is ready. The rival awaits your challenge.", "loop": false}, "oracle-path": {"src": "voice/oracle-path.mp3", "role": "Oracle", "subtitle": "The rival has chosen a path. Your next move may change everything.", "loop": false}, "oracle-rival-lead": {"src": "voice/oracle-rival-lead.mp3", "role": "Oracle", "subtitle": "Your rival is gaining ground. Stay focused.", "loop": false}, "oracle-player-lead": {"src": "voice/oracle-player-lead.mp3", "role": "Oracle", "subtitle": "You are ahead. Maintain your course.", "loop": false}, "oracle-unavailable": {"src": "voice/oracle-unavailable.mp3", "role": "Oracle", "subtitle": "The Oracle is silent. You may continue without its guidance.", "loop": false}, "sailor-rescued": {"src": "voice/sailor-rescued.mp3", "role": "Odysseus", "subtitle": "One more sailor safely home. Keep moving.", "loop": false}, "cyclops-approach": {"src": "voice/cyclops-approach.mp3", "role": "Cyclops", "subtitle": "You tread upon the stones of my cave.", "loop": false}, "circe-challenge": {"src": "voice/circe-challenge.mp3", "role": "Circe", "subtitle": "Come, wanderer. Let us see how well you understand enchantment.", "loop": false}, "sirens-warning": {"src": "voice/sirens-warning.mp3", "role": "Siren", "subtitle": "Come closer, traveler. The sea has such sweet secrets.", "loop": false}, "victory": {"src": "voice/victory.mp3", "role": "Narrator", "subtitle": "Another trial is behind you. The gods have witnessed your resolve. Continue your voyage.", "loop": false}, "defeat": {"src": "voice/defeat.mp3", "role": "Narrator", "subtitle": "The sea has turned against you. Yet your story is not over. Rise, and try again.", "loop": false}, "homecoming": {"src": "voice/homecoming.mp3", "role": "Narrator", "subtitle": "The long voyage has ended. The seas, the gods, the monsters, and the trials could not keep you from Ithaca. Welcome home, Odysseus.", "loop": false}}};const root=document.getElementById('list');
function section(name,items){const d=document.createElement('details');const s=document.createElement('summary');s.textContent=name;d.append(s);for(const [label,src,note] of items){const a=document.createElement('article'),title=document.createElement('span'),audio=document.createElement('audio');title.textContent=label;audio.controls=true;audio.preload='none';audio.src='audio/'+src;audio.addEventListener('play',()=>document.querySelectorAll('audio').forEach(el=>{if(el!==audio)el.pause()}));a.append(title,audio);if(note){const text=document.createElement('small');text.textContent=note;a.append(text)}d.append(a)}root.append(d)}
