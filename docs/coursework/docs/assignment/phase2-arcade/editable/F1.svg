<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700"><rect width="1000" height="700" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#526875"/></marker></defs><text x="25" y="38" font-family="Arial" font-size="26" fill="#22323d"><tspan x="25" dy="0">F1 Start or resume and learn a trial</tspan></text><text x="25" y="77" font-family="Arial" font-size="20" fill="#22323d"><tspan x="25" dy="0">P2 Daniel</tspan></text><rect x="25" y="110" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="133" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">1. Open title and choose Begin / Continue</tspan></text><path d="M285 171 L285 193" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="193" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="216" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">2. New: read introduction or Skip</tspan></text><path d="M285 254 L285 276" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="276" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="299" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">3. Choose the first ready shore on the map</tspan></text><path d="M285 337 L285 359" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="359" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="382" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">4. Read one objective, controls and story context</tspan></text><path d="M285 420 L285 442" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="442" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="465" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">5. Choose short practice or a full round</tspan></text><path d="M285 503 L285 525" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="525" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="548" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">6. See practice result or scored result</tspan></text><path d="M545 140 L590 140" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="130" font-family="Arial" font-size="20" fill="#22323d"><tspan x="605" dy="0">Existing progress</tspan></text><text x="605" y="160" font-family="Arial" font-size="17" fill="#22323d"><tspan x="605" dy="0">Continue retains clears and</tspan><tspan x="605" dy="22.1">preferences. Restart requires S14</tspan><tspan x="605" dy="22.1">confirmation.</tspan></text><path d="M545 472 L590 472" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="462" font-family="Arial" font-size="20" fill="#22323d"><tspan x="605" dy="0">Controls are unfamiliar</tspan></text><text x="605" y="492" font-family="Arial" font-size="17" fill="#22323d"><tspan x="605" dy="0">Practice leaves campaign progress</tspan><tspan x="605" dy="22.1">unchanged. Return to the same</tspan><tspan x="605" dy="22.1">briefing.</tspan></text></svg>