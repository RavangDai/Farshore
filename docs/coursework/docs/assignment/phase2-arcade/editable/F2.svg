<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700"><rect width="1000" height="700" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#526875"/></marker></defs><text x="25" y="38" font-family="Arial" font-size="26" fill="#22323d"><tspan x="25" dy="0">F2 Prepare, review and accept a model strategy</tspan></text><text x="25" y="77" font-family="Arial" font-size="20" fill="#22323d"><tspan x="25" dy="0">P1 Maya and P3 Rosa</tspan></text><rect x="25" y="110" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="133" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">1. Choose a shore, difficulty and AI Rival Battle</tspan></text><path d="M285 171 L285 193" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="193" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="216" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">2. Press Prepare with connected model</tspan></text><path d="M285 254 L285 276" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="276" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="299" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">3. Show elapsed preparation and Cancel</tspan></text><path d="M285 337 L285 359" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="359" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="382" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">4. Server validates allowed plan and focus</tspan></text><path d="M285 420 L285 442" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="442" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="465" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">5. Read strategy and fixed-rules explanation</tspan></text><path d="M285 503 L285 525" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="525" width="520" height="61" fill="#f6f6f6" stroke="#777"/><text x="40" y="548" font-family="Arial" font-size="18" fill="#22323d"><tspan x="40" dy="0">6. Start a labeled model-planned duel</tspan></text><path d="M545 306 L590 306" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="296" font-family="Arial" font-size="20" fill="#22323d"><tspan x="605" dy="0">Cancel, navigation or edited</tspan><tspan x="605" dy="26">input</tspan></text><text x="605" y="326" font-family="Arial" font-size="17" fill="#22323d"><tspan x="605" dy="0">Abort the request and ignore stale</tspan><tspan x="605" dy="22.1">replies. Return to initial state. No</tspan><tspan x="605" dy="22.1">score or progress changes.</tspan></text><path d="M545 472 L590 472" fill="none" stroke="#526875" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="462" font-family="Arial" font-size="20" fill="#22323d"><tspan x="605" dy="0">Reject or refine</tspan></text><text x="605" y="492" font-family="Arial" font-size="17" fill="#22323d"><tspan x="605" dy="0">Prepare another, change</tspan><tspan x="605" dy="22.1">difficulty/mode or choose Solo.</tspan><tspan x="605" dy="22.1">Proposed Discard removes the ready</tspan><tspan x="605" dy="22.1">plan while keeping AI mode.</tspan></text></svg>