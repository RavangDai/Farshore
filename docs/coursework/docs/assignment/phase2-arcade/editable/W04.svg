<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 800"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526875"/></marker></defs><rect x="30" y="30" width="560" height="510" fill="#ffffff" stroke="#555555"/><text x="46" y="64.0" font-family="Arial" font-size="20" font-weight="bold" fill="#222222">W04 Five-stop voyage map</text><text x="46" y="96.0" font-family="Arial" font-size="16" font-weight="normal" fill="#526875">S03 / progress / F1/F5</text><rect x="46" y="119.8" width="528" height="52" fill="#fafafa" stroke="#aaaaaa"/><text x="58" y="147.8" font-family="Arial" font-size="18" font-weight="normal" fill="#252525">Your way home / 2 of 5 passed</text><rect x="46" y="179.8" width="528" height="52" fill="#eeeeee" stroke="#aaaaaa"/><text x="58" y="207.8" font-family="Arial" font-size="18" font-weight="normal" fill="#252525">1 Cyclops, 2 Circe, 3 Sirens, 4 Strait, 5 Bow</text><rect x="46" y="239.8" width="528" height="52" fill="#fafafa" stroke="#aaaaaa"/><text x="58" y="267.8" font-family="Arial" font-size="18" font-weight="normal" fill="#252525">Each stop: Cleared / Assisted / Ready / Locked</text><rect x="46" y="299.8" width="528" height="52" fill="#eeeeee" stroke="#aaaaaa"/><text x="58" y="327.8" font-family="Arial" font-size="18" font-weight="normal" fill="#252525">Continue voyage / choose an unlocked stop</text><text x="30" y="575.0" font-family="Arial" font-size="19" font-weight="bold" fill="#126978">Implemented</text><text x="30" y="612.7" font-family="Arial" font-size="20" font-weight="normal" fill="#526875">Locked later trials explain the preceding requirement. Migration</text><text x="30" y="638.7" font-family="Arial" font-size="20" font-weight="normal" fill="#526875">adds two new pending shores.</text></svg>