<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536874"/></marker></defs><text x="20" y="30" fill="#102e40" font-size="24" font-family="Arial">F2: Give counsel and review the AI decision</text><text x="20" y="58" fill="#46626e" font-size="17" font-family="Arial">P1 Maya and P3 Rosa</text><rect x="22" y="90" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="115" fill="#102e40" font-size="17" font-family="Arial">1. Read scene, time, trust and AI label</text><path d="M240 143 L240 166" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="166" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="191" fill="#102e40" font-size="17" font-family="Arial">2. Write/review 3-800 characters</text><path d="M240 219 L240 242" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="242" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="267" fill="#102e40" font-size="17" font-family="Arial">3. Send once and show processing</text><path d="M240 295 L240 318" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="318" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="343" fill="#102e40" font-size="17" font-family="Arial">4. Validate model structure</text><path d="M240 371 L240 394" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="394" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="419" fill="#102e40" font-size="17" font-family="Arial">5. Review action and short rationale</text><path d="M240 447 L240 470" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="470" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="495" fill="#102e40" font-size="17" font-family="Arial">6. Accept once and show consequence</text><path d="M457 268 L497 268" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="242" width="460" height="106" fill="#fff6e7" stroke="#a9884b"/><text x="517" y="267" fill="#6e5423" font-size="17" font-family="Arial">Cancel or request failure</text><text x="517" y="291" fill="#4b4b4b" font-size="15" font-family="Arial">Restore the draft. Preserve scene, score and trust.</text><text x="517" y="310.5" fill="#4b4b4b" font-size="15" font-family="Arial">Retry, edit or explicitly use Story mode.</text><path d="M457 420 L497 420" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="394" width="460" height="106" fill="#fff6e7" stroke="#a9884b"/><text x="517" y="419" fill="#6e5423" font-size="17" font-family="Arial">Mismatch or unclear advice</text><text x="517" y="443" fill="#4b4b4b" font-size="15" font-family="Arial">A1-UNCERTAIN: hold score. Refine counsel, request a</text><text x="517" y="462.5" fill="#4b4b4b" font-size="15" font-family="Arial">fresh interpretation or discard.</text></svg>