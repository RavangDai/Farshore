<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536874"/></marker></defs><text x="20" y="30" fill="#102e40" font-size="24" font-family="Arial">F4: Recover from a failed or questionable result</text><text x="20" y="58" fill="#46626e" font-size="17" font-family="Arial">P1 Maya and P3 Rosa</text><rect x="22" y="90" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="115" fill="#102e40" font-size="17" font-family="Arial">1. Observe failure or flag mismatch</text><path d="M240 143 L240 166" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="166" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="191" fill="#102e40" font-size="17" font-family="Arial">2. Explain the issue in plain language</text><path d="M240 219 L240 242" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="242" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="267" fill="#102e40" font-size="17" font-family="Arial">3. Preserve draft and uncommitted score</text><path d="M240 295 L240 318" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="318" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="343" fill="#102e40" font-size="17" font-family="Arial">4. Choose Edit, Retry or Story mode</text><path d="M240 371 L240 394" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="394" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="419" fill="#102e40" font-size="17" font-family="Arial">5. Re-submit or discard candidate</text><path d="M240 447 L240 470" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="470" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="495" fill="#102e40" font-size="17" font-family="Arial">6. Return to result review</text><path d="M457 116 L497 116" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="90" width="460" height="106" fill="#fff6e7" stroke="#a9884b"/><text x="517" y="115" fill="#6e5423" font-size="17" font-family="Arial">Poor or empty result</text><text x="517" y="139" fill="#4b4b4b" font-size="15" font-family="Arial">Empty/invalid JSON is an error. A plausible but wrong</text><text x="517" y="158.5" fill="#4b4b4b" font-size="15" font-family="Arial">or harmful reply enters review. A detected policy</text><text x="517" y="178" fill="#4b4b4b" font-size="15" font-family="Arial">issue should never display a scored result.</text><path d="M457 344 L497 344" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="318" width="460" height="106" fill="#fff6e7" stroke="#a9884b"/><text x="517" y="343" fill="#6e5423" font-size="17" font-family="Arial">Rate limit or service offline</text><text x="517" y="367" fill="#4b4b4b" font-size="15" font-family="Arial">Recheck connection, wait, use Story mode or leave with</text><text x="517" y="386.5" fill="#4b4b4b" font-size="15" font-family="Arial">the draft intact. Repeated retry does not advance</text><text x="517" y="406" fill="#4b4b4b" font-size="15" font-family="Arial">time.</text></svg>