<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536874"/></marker></defs><text x="20" y="30" fill="#102e40" font-size="24" font-family="Arial">F5: Explain a consequence and finish the voyage</text><text x="20" y="58" fill="#46626e" font-size="17" font-family="Arial">P1 Maya, P2 Daniel and P3 Rosa</text><rect x="22" y="90" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="115" fill="#102e40" font-size="17" font-family="Arial">1. Read time/trust consequence</text><path d="M240 143 L240 166" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="166" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="191" fill="#102e40" font-size="17" font-family="Arial">2. Open Why this choice?</text><path d="M240 219 L240 242" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="242" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="267" fill="#102e40" font-size="17" font-family="Arial">3. Compare source or inspect map</text><path d="M240 295 L240 318" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="318" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="343" fill="#102e40" font-size="17" font-family="Arial">4. Read previous counsel in log</text><path d="M240 371 L240 394" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="394" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="419" fill="#102e40" font-size="17" font-family="Arial">5. Continue to the next shore</text><path d="M240 447 L240 470" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="470" width="435" height="53" fill="#f7fafb" stroke="#547786"/><text x="38" y="495" fill="#102e40" font-size="17" font-family="Arial">6. Reach Ithaca or the time limit</text><path d="M457 192 L497 192" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="166" width="460" height="106" fill="#fff6e7" stroke="#a9884b"/><text x="517" y="191" fill="#6e5423" font-size="17" font-family="Arial">Explanation seems inconsistent</text><text x="517" y="215" fill="#4b4b4b" font-size="15" font-family="Arial">Current: no reversal control. Proposed review before</text><text x="517" y="234.5" fill="#4b4b4b" font-size="15" font-family="Arial">commitment prevents a disputed score, and practice log</text><text x="517" y="254" fill="#4b4b4b" font-size="15" font-family="Arial">offers one-turn undo.</text><path d="M457 496 L497 496" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="470" width="460" height="106" fill="#fff6e7" stroke="#a9884b"/><text x="517" y="495" fill="#6e5423" font-size="17" font-family="Arial">Report reached</text><text x="517" y="519" fill="#4b4b4b" font-size="15" font-family="Arial">Show elapsed time, final trust and costly choices.</text><text x="517" y="538.5" fill="#4b4b4b" font-size="15" font-family="Arial">Open log, return to title or confirm a new voyage.</text></svg>