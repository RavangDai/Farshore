<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="595" viewBox="0 0 1000 595"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536874"/></marker></defs><text x="20" y="30" fill="#102e40" font-size="25" font-family="Arial">Data flow and privacy boundary</text><rect x="20" y="85" width="210" height="70" fill="#f7fafb" stroke="#547786"/><text x="33" y="115" fill="#102e40" font-size="17" font-family="Arial">Player: counsel</text><rect x="350" y="85" width="230" height="70" fill="#f7fafb" stroke="#547786"/><text x="363" y="115" fill="#102e40" font-size="17" font-family="Arial">React: review text</text><rect x="710" y="85" width="255" height="70" fill="#f7fafb" stroke="#547786"/><text x="723" y="115" fill="#102e40" font-size="17" font-family="Arial">POST /api/turn</text><rect x="710" y="255" width="255" height="70" fill="#f7fafb" stroke="#547786"/><text x="723" y="285" fill="#102e40" font-size="17" font-family="Arial">Local Llama 3.2 3B</text><rect x="350" y="255" width="260" height="70" fill="#f7fafb" stroke="#547786"/><text x="363" y="285" fill="#102e40" font-size="17" font-family="Arial">Validate + authored score</text><rect x="20" y="255" width="260" height="70" fill="#f7fafb" stroke="#547786"/><text x="33" y="285" fill="#102e40" font-size="17" font-family="Arial">UI result + explanation</text><rect x="20" y="430" width="260" height="70" fill="#f7fafb" stroke="#547786"/><text x="33" y="460" fill="#102e40" font-size="17" font-family="Arial">Browser localStorage</text><rect x="350" y="430" width="350" height="70" fill="#f7fafb" stroke="#547786"/><text x="363" y="460" fill="#102e40" font-size="17" font-family="Arial">Browser / OS speech service</text><path d="M230 120 L350 120" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 120 L710 120" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><path d="M837 155 L837 255" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 290 L610 290" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 290 L280 290" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><path d="M145 325 L145 430" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><text x="270" y="70" fill="#536874" font-size="14" font-family="Arial">Reviewed advice + scene ID + trust + mode</text><text x="720" y="195" fill="#536874" font-size="13" font-family="Arial">Scene and advice</text><text x="740" y="352" fill="#536874" font-size="14" font-family="Arial">reply / reason / flags</text><text x="20" y="535" fill="#536874" font-size="14" font-family="Arial">Route, accepted log, time/trust and</text><text x="20" y="553.2" fill="#536874" font-size="14" font-family="Arial">preferences</text><text x="350" y="530" fill="#536874" font-size="14" font-family="Arial">Optional audio / reply text can reach a browser or OS provider.</text><text x="350" y="548.2" fill="#536874" font-size="14" font-family="Arial">Editable transcript returns to React. No app audio storage.</text><path d="M380 155 L325 185 L325 465 L350 465" fill="none" stroke="#a9884b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M650 430 L675 185 L570 155" fill="none" stroke="#a9884b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/></svg>