160 275" fill="none" stroke="#536874" stroke-width="2" marker-end="url(#arrow)"/><text x="80" y="370" fill="#24323b" font-size="18" font-family="Arial">S05 Pause S06 Characters S07 Voyage map</text><text x="80" y="411" fill="#24323b" font-size="18" font-family="Arial">S08 Log S09 Help S10 Story &amp; sources</text><text x="80" y="452" fill="#24323b" font-size="18" font-family="Arial">S11 Settings S12 New voyage confirmation</text><text x="60" y="510" fill="#536874" font-size="16" font-family="Arial">Shared overlays open from title or encounter where relevant and return to the invoking screen. A1:</text><text x="60" y="530.8" fill="#536874" font-size="16" font-family="Arial">model interpretation. A2: optional speech input. A3: optional spoken reply.</text></svg>